version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: colaboradores_hss_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app_network

  backend:
    build: ./backend
    container_name: colaboradores_hss_backend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      FILE_LINK_EXPIRES_IN: ${FILE_LINK_EXPIRES_IN}
      CORS_ORIGIN: ${CORS_ORIGIN}
      API_RATE_LIMIT_WINDOW_MS: ${API_RATE_LIMIT_WINDOW_MS}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX}
      CRON_NOTIFY_SCHEDULE: ${CRON_NOTIFY_SCHEDULE}
      NOTIFY_DAYS_AHEAD: ${NOTIFY_DAYS_AHEAD}
      NOTIFY_RUN_ON_START: ${NOTIFY_RUN_ON_START}
      RH_DEFAULT_NOME: ${RH_DEFAULT_NOME}
      RH_DEFAULT_EMAIL: ${RH_DEFAULT_EMAIL}
      RH_DEFAULT_PASSWORD: ${RH_DEFAULT_PASSWORD}
    volumes:
      - ./uploads:/app/uploads
    networks:
      - app_network

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
