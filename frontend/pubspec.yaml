name: frontend
description: Um app para gestão de documentos de RH.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: "^3.11.3" # Use a versão do seu Dart SDK (verifique com dart --version)

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  provider: ^6.1.1
  intl: ^0.20.2
  image_picker: ^1.0.5
  file_picker: ^6.1.1
  flutter_local_notifications: ^16.1.0
  path_provider: ^2.1.1
  url_launcher: ^6.3.1
  go_router: ^14.0.0
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
